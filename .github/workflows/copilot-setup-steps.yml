name: Copilot Setup Steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .devcontainer/post-create.sh
      - .devcontainer/settings.xml
      - mise.toml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.7
      - name: Expose mise to the agent session
        run: |
          sudo ln -sf "$(command -v mise)" /usr/local/bin/mise
          mise reshim
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - name: Install Maven settings
        run: .devcontainer/post-create.sh
      - name: Verify build environment
        run: |
          mise exec -- mvn -version
          mise exec -- mvn -U -B validate
      - name: Resolve Maven dependencies
        run: mise exec -- mvn -B -ntp dependency:resolve
